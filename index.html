<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"

        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <audio id="audio" controls></audio>

    <title>Document</title>
</head>

<body>

    <button id="play" type="button"><i class="fa-solid fa-play"></i></button>
    <input type="range" id="duration" min="0" value="0">
    <button id="moins"><i class="fa-solid fa-volume-low"></i></button>
    <input type="range" id="vrange" min="0" max="100" value="100">
    <button id="plus"><i class="fa-solid fa-volume-high"></i></button>
    <button id="précédent" type="button"><i class="fa-solid fa-angles-left"></i></button>
    <button id="suivant" type="button"><i class="fa-solid fa-angles-right"></i></button>


    <script src="javascript.js"></script>
</body>

</html>
